name: i18n docs sync

# Hard guard for the i18n-doc-sync skill: fails CI if localized Markdown
# variants (README.md / README.es.md / …) drift out of structural sync.

on:
  push:
    paths: ['**/*.md']
  pull_request:
    paths: ['**/*.md']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Check localized docs are in sync
        run: node scripts/check-i18n-docs.mjs
