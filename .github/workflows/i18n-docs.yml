name: plugin guards

# Three guards that keep the plugin honest:
#  1. plugin doctor    — manifest/agents/commands/skills valid + registered.
#  2. i18n-doc-sync    — localized Markdown variants stay structurally in sync.
#  3. command coverage — every command is documented in the guides.

on:
  push:
    paths: ['**/*.md', 'commands/**', 'agents/**', 'skills/**', '.claude-plugin/**', 'scripts/**']
  pull_request:
    paths: ['**/*.md', 'commands/**', 'agents/**', 'skills/**', '.claude-plugin/**', 'scripts/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Plugin integrity (doctor)
        run: node scripts/check-plugin.mjs
      - name: Localized docs are in sync
        run: node scripts/check-i18n-docs.mjs
      - name: Every command is documented
        run: node scripts/check-docs-commands.mjs
