name: docs guards

# Two guards that keep docs honest:
#  1. i18n-doc-sync  — localized Markdown variants stay structurally in sync.
#  2. command coverage — every command in commands/ is documented in the guides.

on:
  push:
    paths: ['**/*.md', 'commands/**']
  pull_request:
    paths: ['**/*.md', 'commands/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Localized docs are in sync
        run: node scripts/check-i18n-docs.mjs
      - name: Every command is documented
        run: node scripts/check-docs-commands.mjs
